core_version_requirement: ^10.1 || ^11
type: theme
base theme: bootstrap5

name: 'Faith Genesis'
description: 'A Bootstrap 5 subtheme.'

regions:
  navigation: 'Navigation'
  navigation_collapsible: 'Navigation (Collapsible)'
  header: 'Header'
  highlighted: 'Highlighted'
  help: 'Help'
  content: 'Content'
  sidebar_first: 'Primary'
  sidebar_second: 'Secondary'
  footer: 'Footer'
  page_top: 'Page top'
  page_bottom: 'Page bottom'
  banner: 'Banner'
  subfooter: 'Subfooter'
  top_bar: 'Top bar'

libraries:
  - faith_genesis_theme/framework

libraries-override:
  # css/style.css compiles Bootstrap 5 from the base theme's SCSS, so skip the
  # base theme's precompiled copy.
  bootstrap5/global-styling: false
  # We Megamenu loads its own Bootstrap 5 from a CDN; the theme already has it.
  we_megamenu/form.we-mega-menu-frontend:
    css:
      theme:
        https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css: false
